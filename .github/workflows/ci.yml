name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: kody-w/rapp-1
          ref: dda32d741c7218f41443a5bd17eebfe0eae82cb7
          path: rapp-1
      - uses: actions/checkout@v6
        with:
          repository: kody-w/rapp-workspace
          ref: 41bd2f2166e299ea011ec00e5020108f5ac295f0
          path: rapp-workspace
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          RAPP1_PATH: ${{ github.workspace }}/rapp-1
          RAPP_WORKSPACE1_CHECKOUT: ${{ github.workspace }}/rapp-workspace
        run: python3 -B -m unittest discover -s tests -v
      - name: Compile
        run: python3 -m py_compile tools/*.py
      - name: RAPP compliance
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/check_conformance.py . --rapp1-path rapp-1
      - name: Workspace1 core conformance
        run: >-
          python3 -B tools/check_workspace1_conformance.py
          --protocol-checkout "${{ github.workspace }}/rapp-workspace"
          --rapp1-path "${{ github.workspace }}/rapp-1"
          --output .validation/workspace1-core-ci
