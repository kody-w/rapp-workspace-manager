name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: kody-w/rapp-1
          path: rapp-1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Compile
        run: python3 -m py_compile tools/workspace_manager.py tools/append_frame.py
      - name: RAPP compliance
        run: python3 rapp-1/rapp_check.py . --json
